<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Offline — WanderWise</title>
  <style>
    body { margin:0; background:#0a0a0a; color:#f5f5f5; font-family: Inter, system-ui, sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; text-align:center; padding:24px; box-sizing:border-box }
    .card{ max-width:430px; width:100%; padding:32px 24px; background:#151515; border:1px solid #242424; border-radius:16px }
    .gold{ color:#e0c250; font-weight:800; letter-spacing:.16em; text-transform:uppercase; font-size:12px }
    h1{ font-size:26px; margin:12px 0 8px; font-weight:800 }
    p{ color:#9a9a9a; font-size:14px; line-height:1.55; margin:0 0 14px }
    .row{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:16px }
    a,button{ background:#e0c250; color:#111; border:none; padding:12px 20px; border-radius:999px; font-weight:700; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:8px }
    .ghost{ background:transparent; color:#e0c250; border:1px solid #2e2e2e }
    .tiny{ color:#6e6e6e; font-size:12px; margin-top:14px }
  </style>
</head>
<body>
  <div class="card">
    <div class="gold">WanderWise · Offline-first</div>
    <h1>You're offline — but your trip isn't</h1>
    <p>Your itinerary, essentials and emergency numbers work without connection. Reconnect to discover new places.</p>
    <div class="row">
      <button onclick="location.reload()">Retry</button>
      <a href="./">Open saved trips</a>
    </div>
    <p class="tiny">Emergency: 112 · Police 100 · Ambulance 108 · Tourist helpline 1363</p>
  </div>
</body>
</html>
