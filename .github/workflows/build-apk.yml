name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build WanderWise Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Package
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/WanderWise.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WanderWise-APK
          path: apk/WanderWise.apk
          retention-days: 30

      - name: Publish Direct Release APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest-apk
          name: WanderWise Android APK (Latest)
          body: |
            ### 📱 WanderWise Android Mobile App (APK)
            - **File:** `WanderWise.apk` (~10 MB, well under the 100 MB limit)
            - **Version:** v1.0.0
            - **Direct Download:** Click `WanderWise.apk` below to download directly to your Android device or PC.
          files: apk/WanderWise.apk
