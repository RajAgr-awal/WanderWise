<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Offline — WanderWise</title>
  <style>
    body {
      margin: 0;
      background: #0a0a0a;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      max-width: 360px;
      padding: 32px 24px;
      background: #151515;
      border: 1px solid #242424;
      border-radius: 20px;
    }
    .gold { color: #e0c250; font-weight: 800; }
    h1 { font-size: 24px; margin: 12px 0 8px; }
    p { color: #9a9a9a; font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
    button {
      background: #e0c250;
      color: #111;
      border: none;
      padding: 12px 24px;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="gold" style="font-size: 12px; letter-spacing: .2em; text-transform: uppercase;">WANDERWISE</div>
    <h1>You're Offline</h1>
    <p>Connect to the internet to explore new destinations or open your saved trips.</p>
    <button onclick="location.reload()">Retry Connection</button>
  </div>
</body>
</html>
